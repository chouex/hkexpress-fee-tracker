name: 每日更新 HK Express 費用

on:
  schedule:
    # 每日 UTC 00:15（約香港時間 08:15）
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 檢查是否有變動
        id: calc
        run: |
          python hkexpress_fees.py --check
          # --check：有變動 exit 0，無變動 exit 1
          if [ $? -eq 0 ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: 產生最新費用頁面與資料
        if: steps.calc.outputs.changed == 'true'
        run: python hkexpress_fees.py

      - name: 提交變動（如有）
        if: steps.calc.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 自動更新 HK Express 費用 page/json（燃油附加費變動）"
          file_pattern: "docs/index.md hkexpress_fees.json"
          commit_user_name: "hkexpress-fee-bot"
          commit_user_email: "hkexpress-fee-bot@users.noreply.github.com"

  deploy:
    needs: update
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - id: deployment
        uses: actions/deploy-pages@v4
